<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">

<title>ความทรงจำ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%95%B3%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&family=Syncopate:wght@400&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--p:#ece6da;--d:#8f897d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--d)}
#intro{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 26px) 28px calc(env(safe-area-inset-bottom,0px) + 34px);transition:opacity .9s}

#intro .mid p{margin:14px 0 0 4px;font-weight:300;font-size:17px;letter-spacing:.38em;color:#b3ac9e}
#go{align-self:flex-start;background:none;border:0;border-bottom:1px solid rgba(236,230,218,.55);color:var(--p);font:300 20px 'Noto Serif Thai',Georgia,serif;letter-spacing:.08em;padding:14px 2px 12px;cursor:pointer}
#go span{display:inline-block;margin-left:14px;transition:transform .3s}

#flash{position:fixed;inset:0;background:#f4efe4;opacity:0;pointer-events:none;z-index:6}

#hud.on{opacity:1}

@keyframes fade{to{opacity:0}}
#add{pointer-events:auto;background:none;border:0;border-bottom:1px solid rgba(236,230,218,.4);color:var(--p);font:400 10px 'IBM Plex Mono',monospace;letter-spacing:.2em;text-transform:uppercase;padding:8px 0 6px;cursor:pointer}

@keyframes pop{from{transform:scale(.5);opacity:0}}
#li{display:block;max-width:90vw;max-height:66vh;border:1px solid rgba(236,230,218,.25)}
#lc{display:block;box-sizing:border-box;width:100%;min-width:220px;margin:12px 0 4px;padding:10px 0;background:transparent;border:0;border-bottom:1px solid rgba(236,230,218,.35);border-radius:0;color:var(--p);font:400 14px 'IBM Plex Mono','Noto Sans Thai',sans-serif;letter-spacing:.04em;outline:none;-webkit-user-select:text;user-select:text}
#lc:focus{border-bottom-color:rgba(236,230,218,.9)}
#lc::placeholder{color:#6f6a60}
#ld{display:block}
.nv,#x{position:absolute;background:none;border:0;color:var(--p);cursor:pointer;font:200 38px/1 sans-serif;padding:14px}
.nv{top:50%;transform:translateY(-50%)}#pv{left:2px}#nx{right:2px}
#x{top:calc(env(safe-area-inset-top,0px) + 6px);right:6px;font-size:26px}
#intro .top{justify-content:center;text-transform:none;font:400 13px 'Syncopate',sans-serif;letter-spacing:.7em;padding-left:.7em;color:#d4cebf}
.hold{align-self:center;margin:auto 0;position:relative;width:96px;height:96px}
.hold svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);pointer-events:none}
.hold circle{fill:none;stroke-width:1.5}
.hold .bg{stroke:rgba(236,230,218,.3)}
.hold .pr{stroke:#ece6da;stroke-dasharray:289;stroke-dashoffset:289;stroke-linecap:round}
#hb{position:absolute;inset:10px;border-radius:50%;border:0;background:radial-gradient(circle,rgba(236,230,218,.95) 0 4px,rgba(236,230,218,.07) 5px);cursor:pointer;touch-action:none;transition:transform .25s}
*{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button,button:focus,button:active,button:focus-visible{outline:none!important;-webkit-appearance:none;appearance:none}
#hb{box-shadow:none;-webkit-user-drag:none}
.hold{filter:drop-shadow(0 0 calc(4px + var(--c,0)*26px) rgba(255,215,160,calc(.25 + var(--c,0)*.75)))}
#hb{border:1px solid rgba(255,235,200,.55);transition:none;background:radial-gradient(circle at 34% 30%,#fff 0 3px,rgba(255,238,210,.55) 7px,rgba(255,200,130,.16) 55%,rgba(255,200,130,.05) 100%);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 20px rgba(255,220,170,.5),inset 0 0 12px rgba(255,235,205,.35)}}
#add{display:none}
.hold{width:auto;height:auto;filter:none}
#hb{position:relative;inset:auto;display:block;padding:0;width:176px;height:54px;border-radius:999px;border:1px solid rgba(236,230,218,.5);background:rgba(236,230,218,.05);overflow:hidden;cursor:pointer;touch-action:none;transition:transform .25s ease,border-color .4s;animation:soft 3.2s ease-in-out infinite}
@keyframes soft{50%{border-color:rgba(236,230,218,.9)}}
#hf{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(236,230,218,.88);display:block}
#hb b{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#ece6da;mix-blend-mode:difference;display:block}
#add{border:1px solid rgba(236,230,218,.35);border-radius:999px;padding:10px 18px;background:rgba(10,10,10,.45);backdrop-filter:blur(6px);transition:background .25s,border-color .25s}
#add:active{background:rgba(236,230,218,.16)}
/* ปุ่มหน้าแรก = กดที่หลุมดำโดยตรง (หลุมดำวาดบน canvas, ปุ่มเป็นพื้นที่กดโปร่งใส) */
#hb{width:132px;height:132px;border:0;border-radius:50%;background:transparent;overflow:visible;animation:none;cursor:pointer}
#hf,#hb b{display:none}
.hold::after{content:'press & hold';position:absolute;top:calc(100% + 22px);left:50%;transform:translateX(-50%);white-space:nowrap;font:300 10px 'IBM Plex Mono',monospace;letter-spacing:.28em;text-transform:uppercase;color:var(--d);pointer-events:none;transition:opacity .3s;animation:soft2 3.2s ease-in-out infinite}
.hold:has(#hb:active)::after{opacity:0}
@keyframes soft2{50%{color:#d4cebf}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="intro">
  <div class="top mono">step</div>
  <div class="hold"><button id="hb" aria-label="step"><i id="hf"></i><b></b></button></div>
</div>
<div id="flash"></div>
<div id="hud">
  <div class="mono"><span id="cnt">0</span> memories</div>
  <div class="row"><div id="hint">drag — rotate 360°<br>pinch — zoom · tap — open<br>tap the void — release</div></div>
</div>

<div id="lb"><button id="x">✕</button><button class="nv" id="pv">‹</button><button class="nv" id="nx">›</button>
  <div class="fr"><img id="li" alt=""><input id="lc" type="text" maxlength="80" placeholder="write a caption…" autocomplete="off" enterkeyhint="done"><span id="ld" class="mono"></span></div></div>
<script>
// ===== รายการรูป (ไม่จำเป็น) =====
// ว่างไว้ = เว็บดึงรูปจากโฟลเดอร์ photos/ เอง (บน GitHub Pages) หรือโชว์รูปตัวอย่าง
// ถ้าใส่รายการ = โชว์เฉพาะรูปที่ลิสต์ไว้ เช่น
//   {src: "photos/001.jpg", caption: "ข้อความใต้รูป"},
window.PHOTOS = [
];

<script>
const cv=document.getElementById('cv'),g=cv.getContext('2d'),R=Math.random,TAU=Math.PI*2;
let W,H,D,cx,cy,U,fl;
function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cx=W/2;cy=H*.46;U=Math.min(W,H*.95);fl=U*1.15}
addEventListener('resize',rs);rs();
let mode='intro',t0=0,wz=0,yaw=0,pitch=.12,dist=6.5,distT=6.5,vyaw=.045,vpit=0,pulse=0,shake=0,hr=10,drag=false,last=performance.now();
const HR=.062,RIN=.105,ROUT=.36;
// palette
const pal=[],dc=['255,247,228','255,226,172','255,192,112','250,152,72','232,110,50','190,76,40','128,50,34'];
dc.forEach(c=>[.28,.5,.75,1].forEach(a=>pal.push(`rgba(${c},${a})`)));
['196,214,255','150,172,255','204,156,255','255,192,150','255,232,204','122,142,232'].forEach(c=>[.22,.42,.7].forEach(a=>pal.push(`rgba(${c},${a})`)));
// particles: disk 0..ND-1, galaxy ND..N-1
const ND=4800,NG=2600,N=ND+NG,pr=new Float32Array(N),pa=new Float32Array(N),ph=new Float32Array(N),pw=new Float32Array(N),ps=new Float32Array(N),pp=new Uint8Array(N);
for(let i=0;i<ND;i++){const r=RIN+(ROUT-RIN)*Math.pow(R(),1.5),ci=Math.floor((r-RIN)/(ROUT-RIN)*6.99),b=.5+.5*Math.sin(r*230)*.6,ai=Math.floor(Math.min(.999,b*.65+R()*.55)*4);
 pr[i]=r;pa[i]=R()*TAU;ph[i]=(R()-.5)*.006*(r/ROUT);pw[i]=.07*Math.pow(r,-1.5);ps[i]=R()<.1?1.7:1;pp[i]=ci*4+ai}
for(let i=ND;i<N;i++){const r=.12+Math.pow(R(),1.35)*.95,arm=Math.floor(R()*3),ci=r<.28?3+Math.floor(R()*2):r<.55?(R()<.6?2:1):(R()<.5?0:5);
 pr[i]=r;pa[i]=arm*TAU/3+r*5+(R()-.5)*.5*(.4+r);ph[i]=(R()-.5)*.1*Math.exp(-r*1.6);pw[i]=.05*Math.pow(r,-1.2);ps[i]=R()<.06?1.8:1;pp[i]=28+ci*3+Math.floor(R()*3)}
const oD=[...Array(ND).keys()].sort((a,b)=>pp[a]-pp[b]),oG=[...Array(NG).keys()].map(i=>i+ND).sort((a,b)=>pp[a]-pp[b]);
const SX=new Float32Array(N),SY=new Float32Array(N),SZ=new Float32Array(N);
const stars=Array.from({length:520},()=>{let x,y,z,l;do{x=R()*2-1;y=R()*2-1;z=R()*2-1;l=Math.hypot(x,y,z)}while(l>1||l<.1);return{x:x/l,y:y/l,z:z/l,b:.15+R()*.7}});
// tunnel streaks
const wp=Array.from({length:260},()=>{const a=R()*TAU;return{c:Math.cos(a),s:Math.sin(a),d:R(),v:.5+R()*.5,h:R()*30}});
const debris=[],waves=[];
// procedural placeholder photos
function rng(s){return()=>(s=(s*16807)%2147483647)/2147483647}
function gen(seed,sz){const r=rng(seed*977+13),c=document.createElement('canvas');c.width=c.height=sz;const x=c.getContext('2d'),h=r()*360,night=r()<.25;
 let gr=x.createLinearGradient(0,0,0,sz);
 if(night){gr.addColorStop(0,`hsl(${220+r()*30},50%,8%)`);gr.addColorStop(1,`hsl(${230+r()*40},45%,24%)`)}else{gr.addColorStop(0,`hsl(${h},${35+r()*30}%,${25+r()*20}%)`);gr.addColorStop(1,`hsl(${(h+25+r()*30)%360},${55+r()*25}%,${62+r()*14}%)`)}
 x.fillStyle=gr;x.fillRect(0,0,sz,sz);
 x.fillStyle=night?'rgba(240,240,255,.85)':`hsla(${(h+40)%360},90%,88%,.85)`;x.beginPath();x.arc(sz*(.2+r()*.6),sz*(.15+r()*.3),sz*(.05+r()*.07),0,TAU);x.fill();
 if(night){for(let k=0;k<8;k++){const bw=sz*(.08+r()*.1),bh=sz*(.2+r()*.4);x.fillStyle=`hsl(230,30%,${5+r()*8}%)`;x.fillRect(k*sz/7.5,sz-bh,bw,bh);if(sz>200)for(let q=0;q<10;q++){x.fillStyle='rgba(255,210,120,.8)';x.fillRect(k*sz/7.5+r()*bw,sz-bh+r()*bh,sz*.012,sz*.016)}}}
 else for(let L=0;L<3;L++){x.fillStyle=`hsl(${(h+10*L)%360},${30-L*5}%,${34-L*10}%)`;x.beginPath();x.moveTo(0,sz);const base=sz*(.58+L*.12),a1=r()*5,a2=r()*3+1;for(let px=0;px<=sz;px+=sz/24)x.lineTo(px,base+Math.sin(px/sz*a2*3+a1)*sz*.07);x.lineTo(sz,sz);x.fill()}
 const gn=sz>200?600:70;for(let k=0;k<gn;k++){x.fillStyle=`rgba(${r()<.5?255:0},${r()<.5?255:0},${r()<.5?255:0},${r()*.09})`;x.fillRect(r()*sz,r()*sz,sz*.006+1,sz*.006+1)}
 const v=x.createRadialGradient(sz/2,sz/2,sz*.3,sz/2,sz/2,sz*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');x.fillStyle=v;x.fillRect(0,0,sz,sz);return c}
const photos=[];
function addPhoto(c,src,cap,yr,seed,live){const r=.22+Math.pow(R(),.8)*.8,p={c,src,seed,nid:seed?'p'+seed:null,cap,yr,r,a:R()*TAU,w:.05/Math.pow(r,1.1),yh:(R()-.5)*.14*(1.1-r*.5),tilt:(R()-.5)*.22,f:.02,vf:0,lh:0,vl:0,mode:1,timer:1e9,s:0,sx:0,sy:0,z:0,al:0};
 if(live){p.mode=2;p.vl=U*(1.2+R())}photos.push(p);document.getElementById('cnt').textContent=photos.length;return p}
function addSamples(){for(let i=0;i<148;i++)addPhoto(gen(i+1,128),null,'Memory '+String(i+1).padStart(3,'0'),2019+Math.floor(R()*8),i+1,false);}
// events
function spark(p,n){if(debris.length>800)return;for(let i=0;i<n;i++){debris.push({x:cx,y:cy,vx:(R()-.5)*180,vy:-(150+R()*420),l:.5+R()*.8,m:1.4,h:22+R()*28})}}
function suck(){pulse=.5;shake=.15;photos.forEach(p=>{p.mode=3;p.sd=R()*3;p.sv=0});navigator.vibrate&&navigator.vibrate(35)}
function arrive(){mode='main';const fl2=document.getElementById('flash');fl2.style.transition='none';fl2.style.opacity=1;fl2.offsetHeight;fl2.style.transition='opacity 1.6s';fl2.style.opacity=0;
 document.getElementById('hud').classList.add('on');dist=6;distT=2.3;vyaw=.9;pitch=.12;pulse=.5;shake=.2;
 photos.forEach(p=>{p.mode=1;p.f=.02;p.timer=1.5+R()*4.6});navigator.vibrate&&navigator.vibrate(25)}
(()=>{const b=document.getElementById('hb'),fill=document.getElementById('hf'),tp=document.querySelector('#intro .top');let hs=0,raf=0,done=false;const HOLD=1400;
function finish(){done=true;navigator.vibrate&&navigator.vibrate(30);const fe=document.getElementById('flash');fe.style.transition='opacity .35s';fe.style.opacity=.7;
 setTimeout(()=>{document.getElementById('intro').classList.add('off');mode='tunnel';t0=performance.now();wz=0;fe.style.transition='opacity .8s';fe.style.opacity=0},320)}
function step(){if(done)return;const p=Math.min(1,(performance.now()-hs)/HOLD);fill.style.width=(p*100)+'%';b.style.transform='scale('+(1-p*.04)+')';tp.style.opacity=1-p*.6;chg=p;if(p>=1)finish();else raf=requestAnimationFrame(step)}
function press(e){if(done)return;e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(err){}fill.style.transition='none';hs=performance.now();cancelAnimationFrame(raf);step()}
function release(){if(done)return;cancelAnimationFrame(raf);fill.style.transition='width .35s ease';fill.style.width='0';b.style.transform='';tp.style.opacity='';chg=0}
b.addEventListener('pointerdown',press);b.addEventListener('pointerup',release);b.addEventListener('pointercancel',release);b.addEventListener('contextmenu',e=>e.preventDefault())})();
// 3D
let cY,sY,cP,sP,tx,ty,tz;
function tr(x,y,z){const x1=x*cY+z*sY,z1=-x*sY+z*cY;tx=x1;ty=y*cP-z1*sP;tz=y*sP+z1*cP}
function pass(ord,far,zf){let l=-1;for(const i of ord){if((SZ[i]>0)!==far||SX[i]<-9e4)continue;if(pp[i]!==l){g.fillStyle=pal[pp[i]];l=pp[i]}const s=ps[i]*zf;g.fillRect(SX[i]|0,SY[i]|0,s,s)}}
function lens(sc,I,e2){g.globalAlpha=I;let l=-1;for(const i of oD){if(SZ[i]<=0||SX[i]<-9e4)continue;const r=pr[i],rp=r*sc,t=(SX[i]-cx)/rp;if(t>=1||t<=-1)continue;if(pp[i]!==l){g.fillStyle=pal[pp[i]];l=pp[i]}
 const ra=hr*1.1+(r-RIN)*sc*.3;g.fillRect((cx+t*ra)|0,(cy+e2*ra*Math.sqrt(1-t*t))|0,1.3,1.3)}g.globalAlpha=1}
function dp(p){const s=p.s;if(s<2)return;g.globalAlpha=p.al;
 if(s<9){g.drawImage(p.c,p.sx-s/2,p.sy-s/2,s,s)}else{const pd=s*.07;g.save();g.translate(p.sx,p.sy);g.rotate(p.tilt);g.fillStyle='#e8e2d4';g.fillRect(-s/2-pd,-s/2-pd,s+pd*2,s+pd*3.4);g.drawImage(p.c,-s/2,-s/2,s,s);if(p.note&&s>=46){g.fillStyle='#2a2620';g.textAlign='center';g.font=(s*.1)+"px 'IBM Plex Mono',monospace";g.fillText(p.note.length>16?p.note.slice(0,15)+'…':p.note,0,s/2+pd*1.9)}g.restore()}g.globalAlpha=1}
function main(dt,n){
 const live=mode==='main';
 yaw+=vyaw*dt;pitch+=vpit*dt;if(!drag){vyaw+=(.045-vyaw)*Math.min(1,dt*.7);vpit*=Math.exp(-dt*2.2)}
 dist+=(distT-dist)*Math.min(1,dt*1.8);pulse=Math.max(0,pulse-dt*.6);shake=Math.max(0,shake-dt*1.6);
 cY=Math.cos(yaw);sY=Math.sin(yaw);cP=Math.cos(pitch);sP=Math.sin(pitch);
 g.save();if(shake>0)g.translate((R()-.5)*shake*10,(R()-.5)*shake*10);
 for(const s of stars){tr(s.x,s.y,s.z);if(tz>.05){g.globalAlpha=s.b;g.fillStyle='#fff';g.fillRect(cx+tx/tz*fl*.8,cy+ty/tz*fl*.8,1.2,1.2)}}g.globalAlpha=1;
 for(let i=0;i<N;i++){pa[i]+=pw[i]*dt;tr(pr[i]*Math.cos(pa[i]),ph[i],pr[i]*Math.sin(pa[i]));const d=tz+dist;if(d<.15){SX[i]=-1e5;continue}const s=fl/d;SX[i]=cx+tx*s;SY[i]=cy+ty*s;SZ[i]=tz}
 const sc=fl/dist;hr=sc*HR;const zf=Math.max(.7,Math.min(2.4,2.2/dist)),I=Math.max(0,1-Math.abs(sP)*1.3),e2=cP>=0?-1:1;
 g.globalCompositeOperation='lighter';
 const gl=g.createRadialGradient(cx,cy,hr*.9,cx,cy,hr*7);gl.addColorStop(0,`rgba(255,160,70,${.3+pulse*.35})`);gl.addColorStop(.35,'rgba(150,80,60,.1)');gl.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gl;g.beginPath();g.arc(cx,cy,hr*7,0,TAU);g.fill();
 pass(oG,true,zf);pass(oD,true,zf);if(I>.02)lens(sc,I,e2);
 g.globalCompositeOperation='source-over';
 // photos
 let near=[];
 if(live){for(const p of photos){p.a+=p.w*dt;
  if(p.mode===1){p.f+=(.02-p.f)*Math.min(1,dt*4);p.lh*=1-Math.min(1,dt*8);p.vl=0;p.timer-=dt;if(p.timer<=0){p.mode=2;p.lh=0;p.vl=U*(1.1+R()*1.3);spark(p,2)}}

const CANEDIT=false;function saveNote(){}
const IMG_EXT=/\.(jpe?g|png|webp|gif|avif)$/i,CACHE_KEY='mb_list_v1',CACHE_MS=3*60*1000;
function captionFromName(name){
  const base=name.replace(IMG_EXT,'');
  if(/^(IMG|DSC|PXL|MVIMG|Screenshot|image|photo)/i.test(base))return '';
  return base.replace(/^\d+[\s._-]*/,'').replace(/_+/g,' ').trim().slice(0,80);
}
async function listFromGithub(){
  const host=location.hostname,match=host.match(/^(.+)\.github\.io$/);
  if(!match)return [];
  const user=match[1],repo=location.pathname.split('/')[1]||host,key=user+'/'+repo;
  try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');if(c&&c.k===key&&Date.now()-c.t<CACHE_MS)return c.list}catch(e){}
  const res=await fetch('https://api.github.com/repos/'+key+'/contents/photos');
  if(!res.ok)return [];
  const files=await res.json();
  const list=files.filter(f=>f.type==='file'&&IMG_EXT.test(f.name))
    .sort((a,b)=>a.name.localeCompare(b.name,'th',{numeric:true}))
    .map(f=>({src:'photos/'+encodeURIComponent(f.name),caption:captionFromName(f.name)}));
  try{localStorage.setItem(CACHE_KEY,JSON.stringify({k:key,t:Date.now(),list}))}catch(e){}
  return list;
}
async function findPhotos(){
  if(window.PHOTOS&&window.PHOTOS.length)return window.PHOTOS;
  try{return await listFromGithub()}catch(e){console.warn(e);return []}
}
function loadOne(item){
  return new Promise(done=>{
    const src=typeof item==='string'?item:item.src,note=typeof item==='string'?'':(item.caption||''),im=new Image();
    im.decoding='async';
    im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const m=Math.min(im.width,im.height);

      const p=addPhoto(c,src,'',0,0,mode==='main');p.note=note;if(mode==='main')spark(p,2);done()};

    im.src=src;
  });
}
async function loadAll(list){const queue=[...list];const worker=async()=>{while(queue.length)await loadOne(queue.shift())};await Promise.all(Array.from({length:4},worker))}
findPhotos().then(list=>{if(!list.length){addSamples();return}return loadAll(list)});
